[project]
name = "ascaris"
version = "0.1.0"
description = "A lightweight web application for digital scholarly editing and semantic publishing."
requires-python = ">=3.11"
dependencies = [
    "flask==3.0.3",
    "connexion[flask]==3.1.0",
    "flask-sqlalchemy==3.1.1",
    "flask-marshmallow==1.2.1",
    "marshmallow<4",
    "marshmallow-sqlalchemy==1.1.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "rdflib==7.0.0",
]

[dependency-groups]
dev = ["pytest"]
