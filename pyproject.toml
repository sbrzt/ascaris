[project]
name = "ascaris"
version = "0.1.0"
description = "A lightweight web application for digital scholarly editing and semantic publishing."
requires-python = ">=3.11"
dependencies = [
    "marshmallow<4",
    "marshmallow-sqlalchemy==1.1.0",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "pypdf2==3.0.1",
    "python-docx==1.1.2",
    "rdflib==7.0.0",
    "fastapi>=0.149.0",
    "uvicorn>=0.54.0",
    "sqlalchemy>=2.1.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest",
]
